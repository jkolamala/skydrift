<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skydrift</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#100e37;font-family:system-ui,sans-serif;color:white}#game{width:min(100vw,460px);height:min(100dvh,710px);position:relative;overflow:hidden;border-radius:18px;box-shadow:0 20px 70px #0008}canvas{width:100%;height:100%;display:block;touch-action:none}.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;background:#15104499;gap:14px}.hidden{display:none!important}h1{font-size:clamp(44px,11vw,62px);margin:0;color:#40e8f5;text-shadow:3px 4px #7b2ce4,-2px -2px white;letter-spacing:-3px}.card{padding:14px 24px;border:1px solid #bba1ff;background:#161342c9;border-radius:18px;min-width:230px}button{border:2px solid #ffffff99;border-radius:16px;background:linear-gradient(135deg,#27e3e6,#1785e9);color:white;font-weight:900;font-size:17px;padding:12px 25px;cursor:pointer}button.secondary{background:linear-gradient(135deg,#f586d7,#8b50e3)}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;font-weight:900;text-shadow:0 2px 4px #151044}.hud>div{padding:8px 12px;background:#181247aa;border-radius:14px}.hud b{font-size:27px}.shop{position:absolute;inset:0;background:linear-gradient(155deg,#25145af5,#672d99f7);overflow:auto;padding:16px}.shophead{display:flex;justify-content:space-between;align-items:center}.shophead button{padding:7px 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}.item{background:#171345;border:1px solid #bda0f5;border-radius:15px;padding:10px;text-align:center;font-size:13px;font-weight:700}.item button{font-size:12px;padding:7px 10px;margin-top:7px}.item canvas{width:95px;height:70px;margin:auto}.small{font-size:12px;opacity:.85}#notice{min-height:20px;color:#ffe5a3;text-align:center}
</style></head><body><main id="game"><canvas id="scene" width="420" height="650" aria-label="Skydrift flying game"></canvas><div class="hud hidden" id="hud"><div>Score<br><b id="score">0</b><div class="small">Best <span id="bestHud">0</span></div></div><div style="text-align:right">🪙 <span id="runCoins">0</span><div id="hearts">❤️❤️❤️</div><div class="small">🌿 <span id="catches">0</span>/3</div></div></div><section id="home" class="panel"><h1>SKYDRIFT</h1><div style="font-size:54px">🐦🌅</div><div class="card">HIGHEST SCORE<div id="best" style="font-size:38px;font-weight:900">0</div>🪙 Bag: <span id="wallet">0</span></div><button id="play">▶ PLAY</button><button class="secondary" id="shopButton">👕 BIRD SHOP</button><div class="small">Tap / Space to flap · Collect coins · Escape the vine</div></section><section id="over" class="panel hidden"><h1 style="font-size:43px;color:#ff9bdc">GAME OVER</h1><div class="card">Score: <b id="finalScore">0</b><br>Best: <b id="finalBest">0</b><br>🪙 Coins collected: <b id="finalCoins">0</b><br>🌿 Vine catches: <b id="finalCatches">0</b></div><button id="again">↻ PLAY AGAIN</button><button class="secondary" id="goHome">⌂ HOME</button></section><section id="shop" class="shop hidden"><div class="shophead"><button id="back">←</button><strong>👕 BIRD SHOP</strong><strong>🪙 <span id="shopWallet">0</span></strong></div><p class="small" style="text-align:center">Buy birds with coins from your bag!</p><div class="grid" id="items"></div><p id="notice"></p></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('scene'),ctx=cv.getContext('2d'),W=420,H=650;const skins=[['Sky Blue',['#43e7ff','#9476ed','#ffe4fc'],0],['Orange & Yellow',['#ff8a27','#ffdd52','#fff1ad'],15],['Pink, Gold & Teal',['#ff79ca','#f6c943','#3ce0d1'],30],['Green & Blue',['#65ed9a','#3599f2','#d9ffec'],15],['Gold & Red',['#ffd64b','#f24862','#fff0a0'],25],['Pink, Red & Yellow',['#ff8dce','#f34c6e','#ffe361'],25]];let saved={wallet:0,best:0,owned:[0],selected:0};try{Object.assign(saved,JSON.parse(localStorage.getItem('skydrift-v2')||'{}'))}catch{}if(!Array.isArray(saved.owned))saved.owned=[0];const store=()=>{try{localStorage.setItem('skydrift-v2',JSON.stringify(saved))}catch{}};let state='home',bird,pipes,score,coins,hearts,catches,pipeHits,passed,spawnTimer,invulnerable,vineX,vineActive,frame=0,flash=0;const show=s=>{state=s;for(const id of ['home','over','shop','hud'])$(id).classList.add('hidden');$(s==='play'?'hud':s).classList.remove('hidden')};const sync=()=>{$('best').textContent=saved.best;$('wallet').textContent=saved.wallet;$('shopWallet').textContent=saved.wallet;$('bestHud').textContent=saved.best};function hud(){$('score').textContent=score;$('runCoins').textContent=coins;$('hearts').textContent='❤️'.repeat(hearts);$('catches').textContent=catches}function start(){bird={x:112,y:300,vy:0};pipes=[];score=coins=catches=pipeHits=passed=spawnTimer=invulnerable=vineX=0;hearts=3;vineActive=false;flash=0;show('play');hud()}function flap(){if(state==='play')bird.vy=-5.8}function addPipe(){pipes.push({x:W+25,top:100+Math.random()*240,gap:185,num:++spawnTimer,passed:false,hit:false,coin:false})}function finish(){show('over');$('finalScore').textContent=score;$('finalBest').textContent=saved.best;$('finalCoins').textContent=coins;$('finalCatches').textContent=catches;store()}function caught(){catches++;hearts--;pipeHits=0;vineActive=false;vineX=0;flash=24;if(hearts<=0||catches>=3){finish();return}bird.y=310;bird.vy=-3;invulnerable=125;pipes=pipes.filter(p=>p.x>bird.x+90);hud()}function collect(p){if(p.coin)return;p.coin=true;coins++;score++;saved.wallet++;if(coins%20===0)hearts++;saved.best=Math.max(score,saved.best);store();hud()}function update(){frame++;if(state!=='play')return;bird.vy=Math.min(7,bird.vy+.29);bird.y+=bird.vy;if(invulnerable>0)invulnerable--;if(frame%105===0)addPipe();for(const p of pipes){p.x-=2.5;const g=p.top+p.gap;if(!p.passed&&p.x+65<bird.x-15){p.passed=true;passed++;score++;saved.best=Math.max(saved.best,score);store()}const overlap=bird.x+16>p.x&&bird.x-16<p.x+65;if(invulnerable===0&&!p.hit&&overlap&&(bird.y-15<p.top||bird.y+15>g)){p.hit=true;pipeHits++;bird.vy=-3;if(pipeHits>=2)vineActive=true}if(p.num%5===0&&!p.coin&&Math.abs(bird.x-p.x-32)<27&&Math.abs(bird.y-(p.top+p.gap/2))<32)collect(p)}pipes=pipes.filter(p=>p.x>-90);if(invulnerable===0&&(bird.y<18||bird.y>H-24)){bird.y=Math.max(24,Math.min(H-30,bird.y));vineActive=true}if(vineActive){vineX=Math.min(bird.x+15,vineX+3.4);if(vineX>=bird.x-12)caught()}else vineX=Math.max(0,vineX-5);hud()}
function ellipse(x,y,rx,ry,color,angle=0){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,angle,0,Math.PI*2);ctx.fill()}function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function birdArt(x,y,scale=1,colors=skins[saved.selected][1]){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.rotate(state==='play'?Math.max(-.25,Math.min(.55,bird.vy*.05)):Math.sin(frame*.05)*.06);ellipse(0,0,20,17,colors[0]);ellipse(-10,5,12,8,colors[1],-.3);ellipse(-3,-12,8,6,colors[2],-.5);ellipse(9,-5,7,7,'white');ellipse(11,-4,3.7,3.7,'#19214d');ellipse(12,-6,1.4,1.4,'white');ctx.fillStyle='#ffc04c';ctx.beginPath();ctx.moveTo(17,3);ctx.lineTo(29,7);ctx.lineTo(17,11);ctx.fill();ellipse(6,9,3,3,'#f68dab');ctx.restore()}function draw(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#261b83');sky.addColorStop(.36,'#ae4ca9');sky.addColorStop(.7,'#ff8a92');sky.addColorStop(1,'#ffb57c');rect(0,0,W,H,sky);ellipse(310,393,68,68,'#ffd780');for(let i=0;i<20;i++)ellipse((i*97+30)%W,(i*53)%290,1.5,1.5,'#ffffff99');for(let i=0;i<7;i++){let x=(i*137-frame*.15)%560-60,y=110+(i*79)%260;ellipse(x,y,45,15,'#ffb2d055');ellipse(x-12,y-9,20,17,'#ffb2d055')}ctx.fillStyle='#593079';ctx.beginPath();ctx.moveTo(0,535);ctx.lineTo(65,477);ctx.lineTo(115,516);ctx.lineTo(180,460);ctx.lineTo(265,520);ctx.lineTo(335,480);ctx.lineTo(420,525);ctx.lineTo(420,650);ctx.lineTo(0,650);ctx.fill();rect(0,592,W,58,'#372464');if(pipes)for(const p of pipes){const x=p.x,g=p.top+p.gap;let grad=ctx.createLinearGradient(x,0,x+65,0);grad.addColorStop(0,'#168fc6');grad.addColorStop(.45,'#48e7df');grad.addColorStop(1,'#8053d1');rect(x,-10,65,p.top+10,grad);rect(x-5,p.top-18,75,18,'#39dbe7');rect(x,g,65,H-g,grad);rect(x-5,g,75,18,'#39dbe7');ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.shadowColor='#172052';ctx.shadowBlur=5;ctx.fillStyle='white';ctx.fillText(p.num,x+32,p.top-30);ctx.shadowBlur=0;if(p.num%5===0&&!p.coin){let cy=p.top+p.gap/2;ellipse(x+32,cy,16,16,'#ffc52a');ctx.strokeStyle='#fff3a6';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x+32,cy,12,0,7);ctx.stroke();ctx.fillStyle='white';ctx.font='bold 19px system-ui';ctx.fillText('★',x+32,cy+7)}}if(state==='play'&&(vineActive||vineX>0)){ctx.strokeStyle='#225b35';ctx.lineWidth=13;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-20,bird.y+Math.sin(frame*.12)*15);ctx.bezierCurveTo(vineX*.3,bird.y-60,vineX*.7,bird.y+45,vineX,bird.y);ctx.stroke();ctx.strokeStyle='#64ed79';ctx.lineWidth=5;ctx.stroke();for(let j=15;j<vineX;j+=25)ellipse(j,bird.y+Math.sin(j*.08)*18,10,5,'#63e477',j*.2)}if(state==='play'){if(!invulnerable||frame%8<5)birdArt(bird.x,bird.y)}else birdArt(125,305,1.6);if(flash>0){flash--;rect(0,0,W,H,'#aaffcc22');ctx.font='bold 25px system-ui';ctx.fillStyle='white';ctx.textAlign='center';ctx.fillText('🌿 REVIVED! −1 ❤️',210,245)}}function loop(){update();draw();requestAnimationFrame(loop)}loop();cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});document.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&state==='play'){e.preventDefault();flap()}});$('play').onclick=start;$('again').onclick=start;$('goHome').onclick=()=>{sync();show('home')};$('shopButton').onclick=()=>{sync();shop();show('shop')};$('back').onclick=()=>{sync();show('home')};function shop(){const grid=$('items');grid.replaceChildren();skins.forEach(([name,colors,price],i)=>{const item=document.createElement('div');item.className='item';const preview=document.createElement('canvas');preview.width=95;preview.height=70;const pc=preview.getContext('2d');pc.fillStyle=colors[0];pc.beginPath();pc.ellipse(44,34,24,20,0,0,7);pc.fill();pc.fillStyle=colors[1];pc.beginPath();pc.ellipse(32,41,13,10,0,0,7);pc.fill();pc.fillStyle=colors[2];pc.beginPath();pc.ellipse(40,19,9,7,0,0,7);pc.fill();pc.fillStyle='white';pc.beginPath();pc.arc(55,28,8,0,7);pc.fill();pc.fillStyle='#17204b';pc.beginPath();pc.arc(57,28,4,0,7);pc.fill();pc.fillStyle='#ffb63e';pc.beginPath();pc.moveTo(65,35);pc.lineTo(78,39);pc.lineTo(65,44);pc.fill();item.append(preview);const title=document.createElement('div');title.textContent=name;item.append(title);const cost=document.createElement('div');cost.textContent=i===0?'Free':'🪙 '+price;item.append(cost);const button=document.createElement('button');const owned=saved.owned.includes(i);button.textContent=saved.selected===i?'✓ EQUIPPED':owned?'SELECT':'BUY';button.onclick=()=>{if(owned){saved.selected=i;$('notice').textContent=name+' equipped!'}else if(saved.wallet>=price){saved.wallet-=price;saved.owned.push(i);saved.selected=i;$('notice').textContent='Unlocked '+name+'!'}else $('notice').textContent='Need '+(price-saved.wallet)+' more coins!';store();sync();shop()};item.append(button);grid.append(item)})}sync();})();
</script></body></html>
